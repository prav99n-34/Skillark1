{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><p class="eyebrow">OUTCOME FOLLOW-UP</p><h1>Follow-up Centre</h1></div></div><div class="card tablewrap"><table><tr><th>Trainee</th><th>Type</th><th>Due date</th><th>Status</th><th>Channel</th><th>Response</th><th>Update</th></tr>{% for f in followups %}<tr><td>{{f.trainee.name}}</td><td>{{f.followup_type}}</td><td>{{f.due_date}}</td><td>{{f.status}}</td><td>{{f.channel}}</td><td>{{f.response}}</td><td><form method="post" class="inline"><input type="hidden" name="followup_id" value="{{f.id}}"><select name="status">{% for s in ['Completed','Overdue','Due Today','Escalated','Unable to Contact'] %}<option {{'selected' if f.status==s}}>{{s}}</option>{% endfor %}</select><select name="response"><option>Employed</option><option>Unemployed</option><option>Unable to Reach</option></select><button class="btn">Save</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
