{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><p class="eyebrow">ACCOUNTABILITY RECORD</p><h1>Audit Logs</h1></div></div><div class="card tablewrap"><table><tr><th>Timestamp</th><th>User</th><th>Role</th><th>Action</th><th>Record</th><th>Status</th></tr>{% for l in logs %}<tr><td>{{l.timestamp.strftime('%d %b %Y, %H:%M')}}</td><td><span class="namecell"><span class="avatar avatar-{{avatar_gender(l.user_name)}} avatar-xs" aria-hidden="true"></span>{{l.user_name}}</span></td><td>{{l.role}}</td><td>{{l.action}}</td><td>{{l.record}}</td><td><span class="badge good">{{l.status}}</span></td></tr>{% endfor %}</table></div>{% endblock %}
